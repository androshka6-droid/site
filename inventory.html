<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Dean's Auto Sales</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="inventory-page">
            <div class="container">
                <h2>Our Inventory</h2>
                <div class="filter-sort-section">
                    <div class="filter-options">
                        <select name="make">
                            <option value="">All Makes</option>
                            <option value="ford">Ford</option>
                            <option value="chevrolet">Chevrolet</option>
                            <option value="toyota">Toyota</option>
                            <option value="honda">Honda</option>
                        </select>
                        <select name="model">
                            <option value="">All Models</option>
                        </select>
                    </div>
                    <div class="sort-options">
                        <label for="sort">Sort by:</label>
                        <select name="sort" id="sort">
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="year-desc">Year: Newest</option>
                            <option value="year-asc">Year: Oldest</option>
                        </select>
                    </div>
                </div>
                <div class="vehicle-grid" id="inventoryGrid">
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 1">
                        <h3>2024 Ford Mustang GT</h3>
                        <p>$58,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 2">
                        <h3>2024 Chevrolet Silverado 1500</h3>
                        <p>$62,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 3">
                        <h3>2024 Toyota Camry TRD</h3>
                        <p>$42,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 4">
                        <h3>2024 Honda Civic Type R</h3>
                        <p>$45,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 5">
                        <h3>2024 Ford F-150 Raptor</h3>
                        <p>$78,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 6">
                        <h3>2024 Toyota Highlander</h3>
                        <p>$48,000</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="assets/js/main.js"></script>
</body>
</html>
