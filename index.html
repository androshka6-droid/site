<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Dean's Auto Sales</title>
    <link rel="stylesheet" href="assets/css/styles.css" id="theme-stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="hero" style="background-image: url('https://placehold.co/1920x1080/2a2a2a/ffffff?text=HERO+IMAGE');">
            <div class="container">
                <a href="inventory.html" class="btn-hero">BROWSE INV</a>
            </div>
        </section>
        <section class="featured-vehicles">
            <div class="container">
                <h2>Featured Vehicles</h2>
                <div class="vehicle-grid">
                    <a href="#" class="vehicle-card">
                        <div class="vehicle-media" style="background-image: url('https://placehold.co/600x400/333/fff?text=Car+1');"></div>
                        <div class="vehicle-body">
                            <h3>2023 Tesla Model S</h3>
                            <div class="vehicle-meta">
                                <span class="price">$75,000</span>
                            </div>
                        </div>
                    </a>
                    <a href="#" class="vehicle-card">
                        <div class="vehicle-media" style="background-image: url('https://placehold.co/600x400/333/fff?text=Car+2');"></div>
                        <div class="vehicle-body">
                            <h3>2022 Ford Bronco</h3>
                            <div class="vehicle-meta">
                                <span class="price">$45,000</span>
                            </div>
                        </div>
                    </a>
                    <a href="#" class="vehicle-card">
                        <div class="vehicle-media" style="background-image: url('https://placehold.co/600x400/333/fff?text=Car+3');"></div>
                        <div class="vehicle-body">
                            <h3>2024 Toyota Camry</h3>
                            <div class="vehicle-meta">
                                <span class="price">$35,000</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="assets/js/main.js"></script>
</body>
</html>
