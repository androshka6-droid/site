<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Dean's Auto Sales</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="hero" style="background-image: url('https://placehold.co/1920x1080/2a2a2a/ffffff?text=HERO+IMAGE');">
            <div class="container">
                <a href="inventory.html" class="btn-hero">BROWSE INV</a>
            </div>
        </section>
        <section class="featured-vehicles">
            <div class="container">
                <h2>Featured Vehicles</h2>
                <div class="vehicle-grid">
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 1">
                        <h3>2024 Ford Mustang GT</h3>
                        <p>$58,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 2">
                        <h3>2024 Chevrolet Silverado 1500</h3>
                        <p>$62,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 3">
                        <h3>2024 Toyota Camry TRD</h3>
                        <p>$42,000</p>
                    </div>
                    <div class="vehicle-card">
                        <img src="https://via.placeholder.com/300x200" alt="Vehicle 4">
                        <h3>2024 Honda Civic Type R</h3>
                        <p>$45,000</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="assets/js/main.js"></script>
</body>
</html>
