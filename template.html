<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script>
        // Blocking script to prevent FOUC
        (function() {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '../theme_version.txt', false);
                xhr.send(null);
                if (xhr.status === 200) {
                    var version = xhr.responseText.trim();
                    document.write('<link rel="stylesheet" href="../assets/css/styles.css?v=' + version + '" id="theme-stylesheet">');
                } else {
                    document.write('<link rel="stylesheet" href="../assets/css/styles.css?v=' + new Date().getTime() + '" id="theme-stylesheet">');
                }
            } catch (e) {
                console.error("Theme loader failed:", e);
                document.write('<link rel="stylesheet" href="../assets/css/styles.css?v=' + new Date().getTime() + '" id="theme-stylesheet">');
            }
        })();
    </script>
    <noscript>
        <link rel="stylesheet" href="../assets/css/styles.css" id="theme-stylesheet">
    </noscript>
    <style>
        /* Styles specific to the car detail page */
        body {
            background-color: var(--bg);
            color: var(--text);
        }
        .car-detail-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .content-column {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 12px;
        }
        .main-image-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        #main-car-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        .main-image-container .prev-btn, .main-image-container .next-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 20px;
            transition: background-color 0.2s;
        }
        .main-image-container .prev-btn:hover, .main-image-container .next-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .main-image-container .prev-btn { left: 10px; }
        .main-image-container .next-btn { right: 10px; }
        .image-counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .thumbnail-scroller {
            overflow-x: auto;
            margin-bottom: 30px;
        }
        .thumbnail-container {
            display: flex;
            gap: 10px;
            padding-bottom: 10px;
        }
        .thumbnail-item {
            flex: 0 0 120px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.2s;
        }
        .thumbnail-item:hover {
            transform: scale(1.05);
        }
        .thumbnail-item.active {
            border-color: var(--brand);
        }
        .thumbnail-item img {
            width: 100%;
            display: block;
        }
        .description-box {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--stroke);
        }
        .description-box h3 {
            color: var(--brand);
            margin-bottom: 15px;
        }
        .description-box ul {
            list-style: disc;
            padding-left: 20px;
        }
        .description-box ul li {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        .content-column h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .price {
            font-size: 2rem;
            font-weight: bold;
            color: var(--brand);
            margin-bottom: 20px;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            background-color: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .spec-item {
            background: transparent;
            padding: 10px;
            border-bottom: 1px solid var(--stroke);
        }
        .spec-item .label {
            font-weight: bold;
            color: var(--muted);
            font-size: 0.9em;
        }
        .spec-item .value {
            color: var(--text);
            font-size: 1.1em;
        }
        .contact-form-container {
            background-color: var(--surface);
            padding: 30px;
            border-radius: 12px;
            margin-top: 40px;
        }
        .contact-form-container h3 {
            text-align: center;
            color: var(--brand);
            margin-bottom: 20px;
        }
        #contact-form label {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
        }
        #contact-form input, #contact-form textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg);
            border: 1px solid var(--stroke);
            border-radius: 6px;
            color: var(--text);
            margin-bottom: 15px;
        }
        #contact-form .btn-primary {
            width: 100%;
            padding: 15px;
            background-color: var(--brand);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <header id="header-placeholder"></header>

    <main class="car-detail-container">
        <div class="content-column">
            <!-- Image Gallery -->
            <div class="main-image-container">
                <img id="main-car-image" src="{{MAIN_IMAGE_SRC}}" alt="{{TITLE}}">
                <button class="prev-btn">&lt;</button>
                <button class="next-btn">&gt;</button>
                <div class="image-counter" id="image-counter-display">1 / {{IMAGE_COUNT}}</div>
            </div>
            <div class="thumbnail-scroller">
                <div class="thumbnail-container" id="thumbnail-gallery">
                    {{THUMBNAILS}}
                </div>
            </div>

            <!-- Vehicle Info -->
            <h1>{{H1}}</h1>
            <p class="price">{{PRICE}}</p>

            <div class="action-buttons">
                <a href="tel:+1234567890" class="btn">Call Us</a>
                <a href="#contact-form-container" class="btn btn-secondary">Send a Message</a>
            </div>

            <div class="specs-grid">
                {{SPECS}}
            </div>

            <!-- Description -->
            <div class="description-box">
                <h3>Description</h3>
                <ul>
                    {{DESCRIPTION_LIST}}
                </ul>
            </div>
        </div>

        <!-- Contact Form Section -->
        <div id="contact-form-container" class="contact-form-container">
            <h3>Contact Us About This Vehicle</h3>
            <form id="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required>I am interested in this {{TITLE}}.</textarea>

                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer id="footer-placeholder"></footer>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Smooth scroll for the message button
            const messageBtn = document.querySelector('.btn-message');
            if(messageBtn) {
                messageBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            }

            const mainImage = document.getElementById('main-car-image');
            const thumbnails = document.querySelectorAll('.thumbnail-item');
            const imageCounter = document.getElementById('image-counter-display');
            const totalImages = thumbnails.length;
            let currentIndex = 0;

            const imageSources = [{{IMAGE_SOURCES_JS_ARRAY}}];

            function updateGallery(index) {
                if (!mainImage || thumbnails.length === 0) return;

                mainImage.src = `../assets/images/${imageSources[index]}`;

                thumbnails.forEach(thumb => thumb.classList.remove('active'));
                thumbnails[index].classList.add('active');
                thumbnails[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

                if (imageCounter) {
                    imageCounter.textContent = `${index + 1} / ${totalImages}`;
                }

                currentIndex = index;
            }

            thumbnails.forEach((thumbnail, index) => {
                thumbnail.addEventListener('click', () => updateGallery(index));
            });

            document.querySelector('.next-btn').addEventListener('click', () => {
                let nextIndex = (currentIndex + 1) % totalImages;
                updateGallery(nextIndex);
            });

            document.querySelector('.prev-btn').addEventListener('click', () => {
                let prevIndex = (currentIndex - 1 + totalImages) % totalImages;
                updateGallery(prevIndex);
            });

            const contactForm = document.getElementById('contact-form');
            if(contactForm) {
                contactForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    alert('Thank you for your message! We will get back to you shortly.');
                    contactForm.reset();
                });
            }

            if (thumbnails.length > 0) {
                updateGallery(0);
            }
        });
    </script>
</body>
</html>
