<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Contact Us - Dean's Auto Sales</title>
    <script>
        // Blocking script to prevent FOUC
        (function() {
            try {
                var xhr = new XMLHttpRequest();
                // Use a synchronous request for blocking behavior
                xhr.open('GET', '/theme_version.txt', false);
                xhr.send(null);
                if (xhr.status === 200) {
                    var version = xhr.responseText.trim();
                    document.write('<link rel="stylesheet" href="assets/css/styles.css?v=' + version + '" id="theme-stylesheet">');
                } else {
                    // Fallback to timestamp if the request fails
                    document.write('<link rel="stylesheet" href="assets/css/styles.css?v=' + new Date().getTime() + '" id="theme-stylesheet">');
                }
            } catch (e) {
                console.error("Theme loader failed:", e);
                // Fallback in case of any error
                document.write('<link rel="stylesheet" href="assets/css/styles.css?v=' + new Date().getTime() + '" id="theme-stylesheet">');
            }
        })();
    </script>
    <noscript>
        <link rel="stylesheet" href="assets/css/styles.css" id="theme-stylesheet">
    </noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="contact-page">
            <div class="container">
                <h2>Get in Touch</h2>
                <p>We'd love to hear from you. Whether you have a question about a vehicle, financing, or anything else, our team is ready to answer all your questions.</p>
                <div class="contact-form-container">
                    <form class="contact-form" action="send.php" method="POST">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="Phone">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                        <button type="submit" class="btn">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="assets/js/main.js"></script>
</body>
</html>
