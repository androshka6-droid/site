<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Contact Us - Dean's Auto Sales</title>
    <link rel="stylesheet" href="assets/css/styles.css" id="theme-stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <section class="contact-page">
            <div class="container">
                <h2>Get in Touch</h2>
                <p>We'd love to hear from you. Whether you have a question about a vehicle, financing, or anything else, our team is ready to answer all your questions.</p>
                <div class="contact-grid">
                    <div class="contact-form-section">
                        <form class="contact-form" action="https://formspree.io/f/xoqgebrj" method="POST">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Your Name" required>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Your Email" required>
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone" placeholder="Phone">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                            <button type="submit">Send Message</button>
                        </form>
                    </div>
                    <div class="contact-info-section">
                        <h3>Our Location</h3>
                        <p>123 Main St, Anytown, USA</p>
                        <h3>Business Hours</h3>
                        <p>Monday - Friday: 9am - 7pm</p>
                        <p>Saturday: 9am - 5pm</p>
                        <p>Sunday: Closed</p>
                        <div class="map">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12345.6789012345!2d-74.005941!3d40.712784!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTPCsDQyJzQ2LjAiTiA3NMKwMDAnMjEuNCJX!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="assets/js/main.js"></script>
</body>
</html>
